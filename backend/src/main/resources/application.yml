spring:
  application:
    name: enterprise-jira-lite
  config:
    # Loads the repo-root .env (KEY=VALUE lines) whether started from /backend or from the repo root.
    # Real environment variables still take precedence over the file.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${BTS_DB_URL:jdbc:postgresql://localhost:5432/bts}
    username: ${BTS_DB_USER:bts_app}
    password: ${BTS_DB_PASSWORD}            # required: no default secret is baked into the codebase
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET TIME ZONE 'UTC'"
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned exclusively by Flyway. Hibernate never creates or alters anything.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Strict binding: unknown JSON properties are rejected (blocks mass-assignment style probing).
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # forward-headers-strategy is deliberately NOT enabled: trusting X-Forwarded-For here would let
  # clients spoof their IP and evade the login rate limiter. Enable it only behind a trusted proxy.

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-none}]"
  level:
    root: INFO
    com.enterprise.bts: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

bts:
  security:
    jwt-secret: ${BTS_JWT_SECRET}           # required, >= 32 characters
    jwt-ttl-minutes: ${BTS_JWT_TTL_MINUTES:30}
    cookie-secure: ${BTS_COOKIE_SECURE:true}
    cookie-name: BTS_AUTH
    cors-allowed-origin: ${BTS_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  rate-limit:
    login-capacity: 5                       # attempts allowed per client IP...
    login-refill-period-seconds: 60         # ...per rolling refill period
  storage:
    upload-dir: ${BTS_UPLOAD_DIR:./var/uploads}
    max-file-bytes: 5242880                 # 5 MiB, mirrors the DB CHECK constraint
